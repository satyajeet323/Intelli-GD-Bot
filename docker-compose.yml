# ============================================================
# docker-compose.yml — Local development
# Architecture:
#   frontend → backend-node (4000) → ml-server (8000)
#                                  → mongodb (27017)
#                                  → Gemini / Groq / ElevenLabs
# ============================================================
version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML microservice (FastAPI) ──────────────────────────────────────────────
  ml-server:
    build:
      context: ./ml-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ml-server/.env.example
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_SERVER_URL=http://backend-node:4000
      - ML_PORT=8000
    volumes:
      - ml-temp:/app/temp
      - ml-temp-audio:/app/temp_audio
      - ml-segments:/app/segments_temp
      - ml-reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ── Node.js backend ────────────────────────────────────────────────────────
  backend-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/gdbot
      - ML_SERVER_URL=http://ml-server:8000
      - NODE_SERVER_URL=http://backend-node:4000
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
      ml-server:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:4000
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-node

volumes:
  mongo-data:
  uploads:
  ml-temp:
  ml-temp-audio:
  ml-segments:
  ml-reports:

networks:
  default:
    name: gdplatform-network
