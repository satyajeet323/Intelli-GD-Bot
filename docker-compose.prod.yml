# ============================================================
# docker-compose.prod.yml — Production environment
# Zero-downtime: --wait flag ensures health before cutover
# ============================================================
version: "3.9"

services:
  backend-node:
    image: ${REGISTRY}/${IMAGE_PREFIX}/backend-node:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - CLIENT_ORIGINS=${CLIENT_ORIGINS}
      - PYTHON_SERVICE_URL=http://backend-python:8000
      - BCRYPT_ROUNDS=12
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  backend-python:
    image: ${REGISTRY}/${IMAGE_PREFIX}/backend-python:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8000:8000"
      - "6000:6000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - python-temp:/app/temp
      - python-sessions:/app/sessions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  frontend:
    image: ${REGISTRY}/${IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend-node:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  uploads:
    driver: local
  python-temp:
    driver: local
  python-sessions:
    driver: local

networks:
  default:
    name: gdplatform-prod
    driver: bridge
