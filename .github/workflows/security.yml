# ============================================================
# Security — Scheduled & PR security scanning
# Runs: daily at 02:00 UTC + on every PR to main
# ============================================================
name: Security Scan

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CodeQL static analysis ─────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ── Dependency vulnerability scan ─────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit — server
        working-directory: server
        run: |
          npm ci
          npm audit --audit-level=moderate --json | tee npm-audit-server.json
          # Fail on critical vulnerabilities only
          npm audit --audit-level=critical

      - name: npm audit — client
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=moderate --json | tee npm-audit-client.json
          npm audit --audit-level=critical

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit — Python deps
        run: |
          pip install pip-audit
          pip-audit -r server/requirements.txt --format json | tee pip-audit.json || true
          # Report but don't fail on Python audit (torch/whisper have known non-critical issues)
          pip-audit -r server/requirements.txt --ignore-vuln GHSA-34jh-p97f-mpxf || true

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports-${{ github.sha }}
          path: |
            server/npm-audit-server.json
            client/npm-audit-client.json
            pip-audit.json
          retention-days: 30

  # ── Secret scanning ────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret scanning

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ── Docker image scan ──────────────────────────────────────
  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Node image for scanning
        run: docker build -f docker/Dockerfile.node -t gdplatform-node:scan .

      - name: Trivy scan — Node image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gdplatform-node:scan
          format: sarif
          output: trivy-node.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"   # report but don't fail

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-node.sarif
          category: trivy-node

  # ── OWASP dependency check ─────────────────────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "GD-Platform"
          path: "."
          format: "HTML,JSON"
          out: "owasp-reports"
          args: >
            --enableRetired
            --exclude "**/node_modules/**"
            --exclude "**/.git/**"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report-${{ github.sha }}
          path: owasp-reports/
          retention-days: 30
