# ============================================================
# CD — Staging Deployment
# Triggers: push to develop branch (after CI passes)
# Strategy: zero-downtime rolling deploy with health checks
# ============================================================
name: CD — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force deploy even if CI is pending
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false   # never cancel an in-flight deploy

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ── Pre-deploy checks ──────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.meta.outputs.sha }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate deployment metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG="staging-${SHA}-$(date +%Y%m%d%H%M%S)"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying SHA: $SHA  Tag: $TAG"

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.STAGING_MONGODB_URI }}" ]]       && missing+=("STAGING_MONGODB_URI")
          [[ -z "${{ secrets.STAGING_JWT_SECRET }}" ]]        && missing+=("STAGING_JWT_SECRET")
          [[ -z "${{ secrets.STAGING_ADMIN_JWT_SECRET }}" ]]  && missing+=("STAGING_ADMIN_JWT_SECRET")
          [[ -z "${{ secrets.GEMINI_API_KEY }}" ]]            && missing+=("GEMINI_API_KEY")
          [[ -z "${{ secrets.GROQ_API_KEY }}" ]]              && missing+=("GROQ_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

  # ── Build & push Docker images ─────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: pre-deploy
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: backend-node
            dockerfile: docker/Dockerfile.node
            context: .
          - name: backend-python
            dockerfile: docker/Dockerfile.python
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ needs.pre-deploy.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:staging-latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            BUILD_SHA=${{ needs.pre-deploy.outputs.deploy_sha }}
            NODE_ENV=staging

  # ── Deploy to staging ──────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [pre-deploy, build-images]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.STAGING_APP_DIR || '/opt/gdplatform' }}

            echo "=== Pulling latest images ==="
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            export IMAGE_TAG=${{ needs.pre-deploy.outputs.image_tag }}
            export NODE_ENV=staging
            export PORT=4000
            export PYTHON_PORT=8000
            export FLASK_PORT=6000
            export MONGODB_URI="${{ secrets.STAGING_MONGODB_URI }}"
            export JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}"
            export ADMIN_JWT_SECRET="${{ secrets.STAGING_ADMIN_JWT_SECRET }}"
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"
            export ELEVENLABS_API_KEY="${{ secrets.ELEVENLABS_API_KEY }}"
            export CLIENT_ORIGINS="${{ vars.STAGING_CLIENT_ORIGINS }}"
            export PYTHON_SERVICE_URL="http://backend-python:8000"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            echo "=== Waiting for services to be healthy ==="
            sleep 15

      - name: Health check — Node API
        run: |
          for i in {1..12}; do
            if curl -sf "${{ vars.STAGING_URL }}/health"; then
              echo "Node API healthy"
              break
            fi
            [ $i -eq 12 ] && echo "Health check failed" && exit 1
            echo "Retry $i/12..."
            sleep 10
          done

      - name: Health check — WebSocket
        run: |
          curl -sf "${{ vars.STAGING_URL }}/health" | grep -q '"websocket"' || echo "WebSocket status not in health endpoint (non-fatal)"

      - name: Smoke test — Auth endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ vars.STAGING_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"invalid"}')
          # 401 = endpoint alive, 422 = validation alive — both are acceptable
          if [[ "$STATUS" == "401" || "$STATUS" == "422" || "$STATUS" == "400" ]]; then
            echo "Auth endpoint responding: HTTP $STATUS"
          else
            echo "Unexpected status from auth endpoint: $STATUS"
            exit 1
          fi

  # ── Post-deploy notification ───────────────────────────────
  notify-staging:
    name: Notify Staging Deploy
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always()
    steps:
      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-staging.result == 'success' && 'SUCCESS' || 'FAILED' }} *Staging Deploy* - ${{ github.repository }}",
              "attachments": [{
                "color": "${{ needs.deploy-staging.result == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "SHA", "value": "${{ github.sha }}", "short": true},
                  {"title": "Status", "value": "${{ needs.deploy-staging.result }}", "short": true},
                  {"title": "Actor", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
