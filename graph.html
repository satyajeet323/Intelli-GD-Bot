<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GD Bot — Project Memory Graph</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --blue: #58a6ff; --green: #3fb950; --orange: #f0883e;
    --purple: #bc8cff; --red: #f85149; --yellow: #d29922;
    --teal: #39d353; --pink: #ff7b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 56px; position: sticky; top: 0; z-index: 100; overflow-x: auto; }
  nav .logo { font-size: 18px; font-weight: 700; color: var(--blue); margin-right: 16px; white-space: nowrap; }
  nav .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); border: none; background: none; transition: all .2s; white-space: nowrap; }
  nav .tab:hover { color: var(--text); background: var(--surface2); }
  nav .tab.active { color: var(--text); background: var(--surface2); border: 1px solid var(--border); }
  .section { display: none; padding: 24px; }
  .section.active { display: block; }
  .hero { text-align: center; padding: 48px 24px 32px; }
  .hero h1 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-blue { background: rgba(88,166,255,.15); color: var(--blue); }
  .badge-green { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-orange { background: rgba(240,136,62,.15); color: var(--orange); }
  .badge-purple { background: rgba(188,140,255,.15); color: var(--purple); }
  .badge-red { background: rgba(248,81,73,.15); color: var(--red); }
  .badge-yellow { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge-teal { background: rgba(57,211,83,.15); color: var(--teal); }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; margin: 2px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
  .flow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .flow-step { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; }
  .flow-arrow { color: var(--muted); font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  code { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 12px; font-family: 'Fira Code', monospace; color: var(--orange); }
  pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 12px; overflow-x: auto; line-height: 1.6; }
  .stat { text-align: center; }
  .stat .num { font-size: 32px; font-weight: 800; }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sec-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .sec-title span { font-size: 22px; }
  #graph-canvas { width: 100%; height: 680px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tooltip { position: fixed; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; pointer-events: none; z-index: 999; max-width: 260px; line-height: 1.6; }
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 20px; }
  .tl-dot { position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface); }
  .tl-title { font-size: 13px; font-weight: 600; }
  .tl-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .score-bar { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .score-bar .label { font-size: 12px; color: var(--muted); width: 140px; flex-shrink: 0; }
  .score-bar .bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .score-bar .fill { height: 100%; border-radius: 3px; }
  .score-bar .val { font-size: 12px; color: var(--muted); width: 40px; text-align: right; }
  .arch { display: flex; gap: 2px; align-items: stretch; flex-wrap: wrap; }
  .arch-layer { flex: 1; min-width: 180px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .arch-layer h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
  .arch-item { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; margin-bottom: 6px; }
  @media (max-width: 600px) { .hero h1 { font-size: 24px; } }
</style>
</head>
<body>
<div id="app">
<nav>
  <div class="logo">⚡ GD Bot</div>
  <button class="tab active" onclick="showTab('overview',this)">Overview</button>
  <button class="tab" onclick="showTab('architecture',this)">Architecture</button>
  <button class="tab" onclick="showTab('graph',this)">Dependency Graph</button>
  <button class="tab" onclick="showTab('techstack',this)">Tech Stack</button>
  <button class="tab" onclick="showTab('api',this)">API Reference</button>
  <button class="tab" onclick="showTab('workflow',this)">Workflows</button>
  <button class="tab" onclick="showTab('ml',this)">ML Pipeline</button>
  <button class="tab" onclick="showTab('database',this)">Database</button>
  <button class="tab" onclick="showTab('design',this)">UI Design</button>
  <button class="tab" onclick="showTab('admin',this)">Admin Panel</button>
  <button class="tab" onclick="showTab('files',this)">File Map</button>
</nav>
